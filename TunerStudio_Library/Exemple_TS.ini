;-------------------------------------------------------------------------------
; BZO Base TS - fichier .ini exemple, usage general
; Va avec le croquis Exemple_TS.ino et BZO_TS.h
;
; REGLE D'OR : chaque offset et chaque taille ici doivent correspondre octet par
; octet aux structures du croquis (configPage1, configPage2, currentStatus).
;   - pageSize    = sizeof(configPage1), sizeof(configPage2)...
;   - ochBlockSize = sizeof(currentStatus)
;   - blockingFactor = TS_BLOCKING_FACTOR du croquis (64 par defaut)
;   - signature   = TS_SIGNATURE du croquis, au caractere pres
;
; Types : U08 / S08 / U16 / S16 / U32 / S32 / F32  (U = non signe, S = signe)
; Mise a l'echelle : valeur affichee = (valeur brute + translate) * scale
;
; Protocole : dans TS, Fichier > Proprietes du projet > Parametres :
;   "Leger" pour un croquis SANS TS_PROTOCOLE_CRC (Nano, F042...) et pour MSDroid
;   "CRC"   pour un croquis AVEC TS_PROTOCOLE_CRC (le legacy reste accepte)
;-------------------------------------------------------------------------------

[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "BZO GPIO Base TS v1.0"
   versionInfo    = "S"

[TunerStudio]
   iniSpecVersion = 3.64

;-------------------------------------------------------------------------------

[SettingGroups]
   settingGroup  = PROTOCOLE, "Protocole serie"
   settingOption = DEFAULT,   "Leger (sans CRC) - Nano, F042, MSDroid"
   settingOption = PROTO_CRC, "CRC (TS_PROTOCOLE_CRC dans le croquis)"

   ; Remplace le reglage "Temperature Display" de TS (Fahrenheit par defaut) : Celsius en premier = choix par defaut.
   ; Comme Speeduino : canaux temps reel en "°C", jauges en "TEMP", TS affiche selon ce choix.
   settingGroup  = temperatureDisplay, "Temperature"
   settingOption = CELSIUS,    "Celsius"
   settingOption = FAHRENHEIT, "Fahrenheit"

;-------------------------------------------------------------------------------

[PcVariables]
   ; Comme Speeduino : numero CAN de la carte (0 par defaut), utilise dans les commandes
   ; ci-dessous via $tsCanId (format compris par TS et par MSDroid)
   tsCanId          = bits,     U08,   [0:3], "CAN ID 0", "CAN ID 1", "CAN ID 2", "CAN ID 3", "CAN ID 4", "CAN ID 5", "CAN ID 6", "CAN ID 7", "CAN ID 8", "CAN ID 9", "CAN ID 10","CAN ID 11","CAN ID 12","CAN ID 13","CAN ID 14","INVALID"

;-------------------------------------------------------------------------------

[Constants]
   endianness          = little
   nPages              = 2
   pageSize            = 32, 104

   ; Identifiant de page : 2 octets, le 2e est le numero donne a TS.addPage()
   pageIdentifier      = "\$tsCanId\x01", "\$tsCanId\x02"
   pageReadCommand     = "p%2i%2o%2c",   "p%2i%2o%2c"
   pageValueWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   pageChunkWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   crc32CheckCommand   = "d%2i",         "d%2i"
   burnCommand         = "b%2i",         "b%2i"

   blockingFactor      = 64
   tableBlockingFactor = 64
   delayAfterPortOpen  = 1000   ; la Nano redemarre a l'ouverture du port
   blockReadTimeout    = 2000
   tsWriteBlocks       = on
   interWriteDelay     = 10
   pageActivationDelay = 10

#if PROTO_CRC
   messageEnvelopeFormat = msEnvelope_1.0
#endif

;-------------------------------------------------------------------------------
; Page 1 : reglages generaux (configPage1, 32 octets)
;   name = scalar, type, offset, "unites", scale, translate, lo, hi, decimales
;   name = bits,   type, offset, [bit debut:bit fin], "choix 0", "choix 1"...
;-------------------------------------------------------------------------------
page = 1
   sortieActive      = bits,   U08,  0, [0:0], "Off", "On"
   modeSortie        = bits,   U08,  0, [1:2], "Normal", "Inverse", "Clignotant", "INVALID"
   rapportCyclique   = scalar, U08,  1, "%",    1.0,   0.0,    0.0,   100.0, 0
   delaiExtinction   = scalar, U08,  2, "s",    0.1,   0.0,    0.0,    25.5, 1
   canalCapteur      = bits,   U08,  3, [0:2], "A0", "A1", "A2", "A3", "A4", "A5", "A6", "A7"
   seuilRegime       = scalar, U16,  4, "rpm",  1.0,   0.0,    0.0, 20000.0, 0
   offsetTemperature = scalar, S16,  6, "C",    0.1,   0.0,  -50.0,    50.0, 1
   tempsAllumage     = scalar, U16,  8, "ms",   1.0,   0.0,    0.0, 60000.0, 0
   frequencePWM      = scalar, U16, 10, "Hz",   1.0,   0.0,   10.0,  5000.0, 0
   tensionMin        = scalar, U16, 12, "V",    0.01,  0.0,    0.0,    20.0, 2
   tensionMax        = scalar, U16, 14, "V",    0.01,  0.0,    0.0,    20.0, 2
   ; octets 16 a 31 libres (libre[16] dans le croquis)

;-------------------------------------------------------------------------------
; Page 2 : courbe + table (configPage2, 104 octets)
;   name = array, type, offset, [n] ou [colonnes x lignes], "unites", scale, translate, lo, hi, decimales
;-------------------------------------------------------------------------------
page = 2
   courbeX           = array,  U08,  0, [8],   "C",    1.0, -40.0,  -40.0,   215.0, 0
   courbeY           = array,  U08,  8, [8],   "%",    1.0,   0.0,    0.0,   255.0, 0
   tableRegime       = array,  U16, 16, [8],   "rpm",  1.0,   0.0,    0.0, 20000.0, 0
   tableCharge       = array,  U08, 32, [8],   "%",    1.0,   0.0,    0.0,   100.0, 0
   tableValeurs      = array,  U08, 40, [8x8], "%",    1.0,   0.0,    0.0,   255.0, 0

;-------------------------------------------------------------------------------

[ConstantsExtensions]
   ; Ces reglages demandent un redemarrage de la carte (TS le rappelle a l'utilisateur)
   requiresPowerCycle = canalCapteur

;-------------------------------------------------------------------------------

[Menu]
   menuDialog = main

   menu = "&Reglages"
      subMenu = reglagesGeneraux, "Reglages generaux"
      subMenu = reglagesTension,  "Seuils de tension"
      subMenu = std_separator
      subMenu = courbeCorrection, "Courbe de correction"
      subMenu = tableExemple,     "Table exemple"

   menu = "&Commandes"
      subMenu = commandesDirectes, "Commandes directes"

;-------------------------------------------------------------------------------

[UserDefined]
   dialog = reglagesGeneraux, "Reglages generaux"
      field = "Sortie active",           sortieActive
      field = "Mode de sortie",          modeSortie,        { sortieActive }
      field = "Rapport cyclique",        rapportCyclique,   { sortieActive }
      field = "Frequence PWM",           frequencePWM,      { sortieActive }
      field = "Delai d'extinction",      delaiExtinction
      field = "Temps d'allumage",        tempsAllumage
      field = "Seuil de regime",         seuilRegime
      field = ""
      field = "Entree capteur",          canalCapteur
      field = "Correction temperature",  offsetTemperature

   dialog = reglagesTension, "Seuils de tension"
      field = "Tension mini (alarme)",   tensionMin
      field = "Tension maxi",            tensionMax

   dialog = commandesDirectes, "Commandes directes"
      field = "#Ces boutons envoient une commande directe a la carte"
      commandButton = "Sortie ON",                cmdSortieOn
      commandButton = "Sortie OFF",               cmdSortieOff
      commandButton = "RAZ compteurs d'erreurs",  cmdRazErreurs

;-------------------------------------------------------------------------------

[ControllerCommands]
   ; nom = "E\xGG\xNN"  ->  TS.addCommand(GG, NN, MaFonction) dans le croquis
   cmdSortieOn   = "E\x01\x01"
   cmdSortieOff  = "E\x01\x02"

   ; --- Boutons integres a BZO_TS.h (rien a ecrire dans le croquis) ---
   cmdRazErreurs = "E\xFF\x01"   ; remise a zero des compteurs d'erreurs

;-------------------------------------------------------------------------------

[CurveEditor]
   curve = courbeCorrection, "Courbe de correction"
      columnLabel = "Temperature", "Correction"
      xAxis       = -40, 215, 6
      yAxis       =   0, 255, 6
      xBins       = courbeX, temperature
      yBins       = courbeY

;-------------------------------------------------------------------------------

[TableEditor]
   ;       table_id,      map3d_id,     "titre",          page
   table = tableExemple, tableExemple3D, "Table exemple", 2
      xBins       = tableRegime, rpm
      yBins       = tableCharge, charge
      xyLabels    = "RPM", "Charge"
      zBins       = tableValeurs
      gridHeight  = 2.0
      gridOrient  = 250, 0, 340
      upDownLabel = "(PLUS)", "(MOINS)"

;-------------------------------------------------------------------------------

[GaugeConfigurations]
   ; Nom = variable, "Titre", "Unites", Lo, Hi, LoD, LoW, HiW, HiD, decimales valeur, decimales echelle
   gaugeCategory = "Principal"
   regimeGauge      = rpm,               "Regime",           "rpm",   0, 8000,    0,    0, 6500, 7000, 0, 0
   temperatureGauge = temperature,       "Temperature",      "TEMP", -40, 150,  -40,  -20,  100,  120, 1, 0
   tensionGauge     = tension,           "Tension",          "V",     0,   18,   10,   11,   15,   16, 2, 0
   rapportGauge     = rapportCyclique,   "Rapport cyclique", "%",     0,  100,   -1,   -1,  101,  101, 0, 0
   chargeGauge      = charge,            "Charge",           "%",     0,  100,   -1,   -1,  101,  101, 0, 0
   tableGauge       = sortieTable,       "Sortie table",     "%",     0,  255,   -1,   -1,  256,  256, 0, 0

   gaugeCategory = "Systeme"
   bouclesGauge     = bouclesSec,        "Boucles / s",      "",      0, 60000,  -1,   -1, 60001, 60001, 0, 0
   erreursGauge     = erreursCom,        "Erreurs com",      "",      0,  255,   -1,   -1,    1,   10, 0, 0
   clockGauge       = secl,              "Horloge",          "s",     0,  255,   10,   10,  245,  245, 0, 0

;-------------------------------------------------------------------------------

[FrontPage]
   gauge1 = regimeGauge
   gauge2 = temperatureGauge
   gauge3 = tensionGauge
   gauge4 = rapportGauge
   gauge5 = chargeGauge
   gauge6 = tableGauge
   gauge7 = bouclesGauge
   gauge8 = erreursGauge

   ;            expression          texte OFF          texte ON              fond OFF, texte OFF, fond ON, texte ON
   indicator = { sortieOn      }, "Sortie OFF",      "Sortie ON",          white, black, green,  black
   indicator = { alarme        }, "Tension OK",      "ALARME TENSION",     white, black, red,    black
   indicator = { memoireOK     }, "Memoire invalide","Memoire OK",         red,   black, green,  black
   indicator = { sauvegarde    }, "Memoire a jour",  "Sauvegarde...",      white, black, yellow, black
   indicator = { modeCRC       }, "Protocole leger", "Protocole CRC",      white, black, white,  black

;-------------------------------------------------------------------------------

[OutputChannels]
   ; Donnees temps reel = currentStatus du croquis
   ochGetCommand     = "r\$tsCanId\x30%2o%2c"
   ochBlockSize      = 16

   ; --- Bloc standard BZO_TS (TS_ENTETE, rempli par la librairie) : a copier tel quel ---
   secl              = scalar, U08,  0, "s",       1.000, 0.000
   statutTS          = scalar, U08,  1, "bits",    1.000, 0.000
   memoireOK         = bits,   U08,  1, [0:0]
   sauvegarde        = bits,   U08,  1, [1:1]
   modeCRC           = bits,   U08,  1, [2:2]
   memoireTropPetite = bits,   U08,  1, [3:3]
   erreursCom        = scalar, U08,  2, "",        1.000, 0.000
   bouclesSec        = scalar, U16,  4, "loops",   1.000, 0.000
   ; --- Fin du bloc standard : vos donnees commencent a l'offset 6 ---

   sortieOn          = bits,   U08,  6, [0:0]
   alarme            = bits,   U08,  6, [1:1]
   rpm               = scalar, U16,  7, "rpm",     1.000, 0.000
   temperature       = scalar, S16,  9, "°C",      0.100, 0.000
   tension           = scalar, U16, 11, "V",       0.010, 0.000
   rapportCyclique   = scalar, U08, 13, "%",       1.000, 0.000
   charge            = scalar, U08, 14, "%",       1.000, 0.000
   sortieTable       = scalar, U08, 15, "%",       1.000, 0.000

   ; Canaux calcules par TS (pas envoyes par la carte)
   time              = { timeNow }
   seconds           = { secl }

;-------------------------------------------------------------------------------

[Datalog]
   ;       Canal              Libelle          Type    Format
   entry = time,              "Time",          float,  "%.3f"
   entry = secl,              "SecL",          int,    "%d"
   entry = rpm,               "RPM",           int,    "%d"
   entry = temperature,       "Temperature",   float,  "%.1f"
   entry = tension,           "Tension",       float,  "%.2f"
   entry = rapportCyclique,   "RC",            int,    "%d"
   entry = charge,            "Charge",        int,    "%d"
   entry = sortieTable,       "Sortie table",  int,    "%d"
   entry = statutTS,          "Statut TS",     int,    "%d"
   entry = erreursCom,        "Erreurs com",   int,    "%d"
